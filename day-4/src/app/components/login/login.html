<section class="login">
  <h2>Login</h2>
  <p>
    This is a stand-in login — there's no real username/password, clicking
    the button just flips a flag in <code>AuthService</code>. It exists to
    give the <code>authGuard</code> something real to check.
  </p>
  <button type="button" (click)="onLogin()">Log In</button>
</section>
