<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="auth.isAuthenticated() && !isHandset()"
  >
    @if (auth.isAuthenticated()) {
      <mat-nav-list>
        <a
          mat-list-item
          routerLink="/dashboard"
          routerLinkActive="active-link"
          (click)="isHandset() && sidenav.close()"
        >
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a
          mat-list-item
          routerLink="/share"
          routerLinkActive="active-link"
          (click)="isHandset() && sidenav.close()"
        >
          <mat-icon matListItemIcon>qr_code_2</mat-icon>
          <span matListItemTitle>Share</span>
        </a>
      </mat-nav-list>
    }
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (auth.isAuthenticated() && isHandset()) {
        <button
          mat-icon-button
          type="button"
          (click)="sidenav.toggle()"
          aria-label="Toggle navigation menu"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span>Day 12: Angular Dashboard</span>
      <span class="spacer"></span>
      @if (auth.isAuthenticated()) {
        <span class="current-user">{{ auth.currentUser()?.username }}</span>
        <button mat-icon-button type="button" (click)="logout()" aria-label="Log out">
          <mat-icon>logout</mat-icon>
        </button>
      }
    </mat-toolbar>

    <main class="layout">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
