<section class="product-form" aria-labelledby="product-form-heading">
  <h2 id="product-form-heading">Add a product</h2>

  <form (submit)="onSubmit($event)">
    <label for="name">Name</label>
    <input id="name" type="text" [value]="name" (input)="onNameInput($event)" />

    <label for="price">Price</label>
    <input id="price" type="number" step="0.01" [value]="price" (input)="onPriceInput($event)" />

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="!canSubmit">
      {{ submitting() ? 'Adding…' : 'Add product' }}
    </button>
  </form>
</section>
